<div class="login-idoso-page">

  <div class="painel-esquerdo">
    <img src="/img/login.jpg" alt="Estudantes" class="bg-imagem">
    <div class="overlay"></div>
    <div class="logo-centro">
      <span class="icone-marca"><i class="fi fi-sr-book-open-cover"></i></span>
      <span class="nome-marca">ReviStuda</span>
    </div>
  </div>
  <div class="painel-direito">
    <div class="formulario-bloco">

      <div class="alert-erro" *ngIf="erro()">{{ erro() }}</div>

      <ng-container *ngIf="isLogin()">
        <h2 class="titulo-form">Entrar na minha conta</h2>

        <div class="campo-grupo">
          <label class="campo-label" for="email">Seu e-mail</label>
          <div class="campo-input-wrap" [class.campo-erro]="emailTocado && !email.trim()">
            <i class="fi fi-rr-envelope campo-icone"></i>
            <input id="email" type="email" class="campo-input"
              placeholder="exemplo@email.com"
              [(ngModel)]="email"
              (blur)="marcarTocado('email')"
              autocomplete="email"/>
          </div>
          <span class="msg-erro-campo" *ngIf="emailTocado && !email.trim()">Preencha o e-mail.</span>
        </div>

        <div class="campo-grupo">
          <label class="campo-label" for="senha">Sua senha</label>
          <div class="campo-input-wrap" [class.campo-erro]="senhaTocada && !senha.trim()">
            <i class="fi fi-rr-lock campo-icone"></i>
            <input id="senha" [type]="mostrarSenha ? 'text' : 'password'" class="campo-input"
              placeholder="Digite sua senha"
              [(ngModel)]="senha"
              (blur)="marcarTocado('senha')"
              autocomplete="current-password"/>
            <button type="button" class="btn-olho" (click)="toggleSenha()">
              <i class="fi" [class.fi-rr-eye]="!mostrarSenha" [class.fi-rr-eye-crossed]="mostrarSenha"></i>
            </button>
          </div>
          <span class="msg-erro-campo" *ngIf="senhaTocada && !senha.trim()">Preencha a senha.</span>
          <a href="javascript:void(0)" class="link-esqueci" (click)="irParaEsqueciSenha()">Esqueci minha senha</a>
        </div>

        <button type="button" class="btn-voz" (click)="loginPorVoz()"
          [class.btn-voz--ativo]="escutando()">
          <span class="voz-icone-circulo" [class.pulsando]="escutando()">
            <i class="fi fi-rr-microphone"></i>
          </span>
          <span class="voz-texto">
            <span class="voz-titulo">
              {{ escutando() ? 'Escutando... (clique para parar)' : 'Entrar por comando de voz' }}
            </span>
            <span class="voz-instrucao" *ngIf="escutando() && campoAlvo()">
              {{ mensagemVoz() }}
            </span>
          </span>
        </button>

        <div class="voz-feedback" *ngIf="!escutando() && mensagemVoz()">
          <i class="fi fi-rr-check-circle"></i> {{ mensagemVoz() }}
        </div>

        <button type="button" class="btn-entrar" (click)="login()" [disabled]="carregando()">
          <span *ngIf="!carregando()">Entrar <i class="fi fi-rr-arrow-right"></i></span>
          <span *ngIf="carregando()">Entrando...</span>
        </button>

        <button type="button" class="btn-cadastrar" (click)="setModo(false)">
          Cadastrar-se
        </button>
      </ng-container>

      <ng-container *ngIf="!isLogin()">
        <h2 class="titulo-form">Criar minha conta</h2>

        <div class="campo-grupo">
          <label class="campo-label" for="nome">Seu nome completo</label>
          <div class="campo-input-wrap" [class.campo-erro]="nomeTocado && !nome.trim()">
            <i class="fi fi-rr-user campo-icone"></i>
            <input id="nome" type="text" class="campo-input"
              placeholder="Como devemos te chamar?"
              [(ngModel)]="nome"
              (blur)="marcarTocado('nome')"
              autocomplete="name"/>
          </div>
          <span class="msg-erro-campo" *ngIf="nomeTocado && !nome.trim()">Preencha o nome.</span>
        </div>

        <div class="campo-grupo">
          <label class="campo-label" for="emailCadastro">Seu e-mail</label>
          <div class="campo-input-wrap" [class.campo-erro]="emailCadastroTocado && !emailCadastro.trim()">
            <i class="fi fi-rr-envelope campo-icone"></i>
            <input id="emailCadastro" type="email" class="campo-input"
              placeholder="exemplo@email.com"
              [(ngModel)]="emailCadastro"
              (blur)="marcarTocado('emailCadastro')"
              autocomplete="email"/>
          </div>
          <span class="msg-erro-campo" *ngIf="emailCadastroTocado && !emailCadastro.trim()">Preencha o e-mail.</span>
        </div>

        <div class="campo-grupo">
          <label class="campo-label" for="senhaCadastro">Crie uma senha</label>
          <div class="campo-input-wrap" [class.campo-erro]="senhaCadastroTocada && senhaCadastro.trim().length < 6">
            <i class="fi fi-rr-lock campo-icone"></i>
            <input id="senhaCadastro" [type]="mostrarSenhaCadastro ? 'text' : 'password'" class="campo-input"
              placeholder="Mínimo 6 caracteres"
              [(ngModel)]="senhaCadastro"
              (blur)="marcarTocado('senhaCadastro')"
              autocomplete="new-password"/>
            <button type="button" class="btn-olho" (click)="toggleSenhaCadastro()">
              <i class="fi" [class.fi-rr-eye]="!mostrarSenhaCadastro" [class.fi-rr-eye-crossed]="mostrarSenhaCadastro"></i>
            </button>
          </div>
          <span class="msg-erro-campo" *ngIf="senhaCadastroTocada && senhaCadastro.trim().length < 6">
            A senha precisa ter no mínimo 6 caracteres.
          </span>
        </div>

        <button type="button" class="btn-voz" (click)="loginPorVoz()"
          [class.btn-voz--ativo]="escutando()">
          <span class="voz-icone-circulo" [class.pulsando]="escutando()">
            <i class="fi fi-rr-microphone"></i>
          </span>
          <span class="voz-texto">
            <span class="voz-titulo">
              {{ escutando() ? 'Escutando... (clique para parar)' : 'Cadastrar por comando de voz' }}
            </span>
            <span class="voz-instrucao" *ngIf="escutando() && campoAlvo()">
              {{ mensagemVoz() }}
            </span>
          </span>
        </button>

        <div class="voz-feedback" *ngIf="!escutando() && mensagemVoz()">
          <i class="fi fi-rr-check-circle"></i> {{ mensagemVoz() }}
        </div>

        <button type="button" class="btn-entrar" (click)="cadastrar()" [disabled]="carregando()">
          <span *ngIf="!carregando()">Cadastrar <i class="fi fi-rr-arrow-right"></i></span>
          <span *ngIf="carregando()">Enviando...</span>
        </button>

        <button type="button" class="btn-cadastrar" (click)="setModo(true)">
          Já tenho conta — Entrar
        </button>
      </ng-container>

      <div class="acessibilidade-bloco">
        <span class="acess-titulo">Tamanho da letra:</span>
        <div class="controle-fonte">
          <button type="button" class="btn-fonte" (click)="diminuirFonte()">A−</button>
          <button type="button" class="btn-fonte" (click)="aumentarFonte()">A+</button>
        </div>
      </div>

    </div>
  </div>
</div>
