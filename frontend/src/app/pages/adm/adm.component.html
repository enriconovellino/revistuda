<div class="adm-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">ReviStuda <i class="bi bi-gear-fill"></i></div>

    <nav class="sidebar-nav">
      <a routerLink="overview" routerLinkActive="active" class="nav-item">
        <i class="bi bi-speedometer2 nav-icon"></i>
        <span>Visão Geral</span>
      </a>
      <a routerLink="users" routerLinkActive="active" class="nav-item">
        <i class="bi bi-people-fill nav-icon"></i>
        <span>Usuários</span>
      </a>
      <a routerLink="turmas" routerLinkActive="active" class="nav-item">
        <i class="bi bi-building nav-icon"></i>
        <span>Turmas</span>
      </a>
      <a routerLink="modulos" routerLinkActive="active" class="nav-item">
        <i class="bi bi-book-fill nav-icon"></i>
        <span>Módulos</span>
      </a>
      <a routerLink="conteudos" routerLinkActive="active" class="nav-item">
        <i class="bi bi-file-text-fill nav-icon"></i>
        <span>Conteúdos</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">{{ userName() }}</div>
      <button class="logout-btn" (click)="logout()">Sair</button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
