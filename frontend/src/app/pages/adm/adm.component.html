<div class="d-flex" style="min-height: 100vh; background: #f5f7fb;">
  <app-sidebar-admin [currentView]="currentView()" (currentViewChange)="currentView.set($event)"
    (collapsedChange)="sidebarCollapsed.set($event)"></app-sidebar-admin>

  <div class="flex-grow-1" [style.margin-left]="sidebarCollapsed() ? '68px' : '240px'" style="transition: margin-left 0.25s ease;">
    <div class="main-header d-flex justify-content-between align-items-center">
      <div>
        <span class="text-muted fw-semibold small">Administração</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="d-flex align-items-center gap-2" style="cursor: pointer;" (click)="abrirEditarPerfil()">
          <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold"
            style="width: 36px; height: 36px; background: #0f2744 !important;">
            {{ userName().charAt(0).toUpperCase() }}
          </div>
          <div>
            <div class="fw-semibold small">{{ userName() }}</div>
            <div class="text-muted" style="font-size: 11px;">Administrador</div>
          </div>
        </div>
      </div>
    </div>

    <div class="p-4">
      <app-dashboard-admin *ngIf="currentView() === 'dashboard'" (irPara)="irPara($event)"></app-dashboard-admin>
      <app-usuarios-admin *ngIf="currentView() === 'usuarios'"></app-usuarios-admin>
      <app-turmas-admin *ngIf="currentView() === 'turmas'"></app-turmas-admin>
      <app-relatorios-admin *ngIf="currentView() === 'relatorios'"></app-relatorios-admin>
    </div>
  </div>
</div>

<app-editar-perfil [isOpen]="isEditProfileOpen()" (close)="fecharEditarPerfil()"
  (saveSuccess)="onProfileUpdated($event)"></app-editar-perfil>
