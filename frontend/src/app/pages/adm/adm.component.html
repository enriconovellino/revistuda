<div class="adm-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">ReviStuda ⚙️</div>

    <nav class="sidebar-nav">
      <a routerLink="overview" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📊</span>
        <span>Visão Geral</span>
      </a>
      <a routerLink="users" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">👥</span>
        <span>Usuários</span>
      </a>
      <a routerLink="turmas" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🏫</span>
        <span>Turmas</span>
      </a>
      <a routerLink="modulos" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📚</span>
        <span>Módulos</span>
      </a>
      <a routerLink="conteudos" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📝</span>
        <span>Conteúdos</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">{{ userName() }}</div>
      <button class="logout-btn" (click)="logout()">Sair</button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
