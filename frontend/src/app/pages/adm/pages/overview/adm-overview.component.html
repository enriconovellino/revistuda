<div class="container-fluid px-4 py-4">
  <div class="mb-4">
    <h1 class="h3 fw-bold text-white mb-1">Visão Geral</h1>
    <p class="text-secondary mb-0">Resumo de todos os recursos da plataforma</p>
  </div>

  <div class="text-center py-5" *ngIf="loading()">
    <div class="spinner-border text-info" role="status"></div>
    <p class="text-secondary mt-2">Carregando dados...</p>
  </div>

  <ng-container *ngIf="!loading()">
    <div class="row g-3 mb-4">
      <div class="col-sm-6 col-xl-3">
        <div class="card border-0 border-start border-5 text-white h-100" style="background:#1e293b;border-color:#0066b3!important">
          <div class="card-body d-flex align-items-center gap-3">
            <i class="bi bi-people-fill fs-2" style="color:#41b6e6"></i>
            <div>
              <div class="fs-2 fw-bold lh-1" style="color:#41b6e6">{{ users().length }}</div>
              <div class="text-secondary small text-uppercase fw-semibold">Usuários</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="card border-0 border-start border-5 text-white h-100" style="background:#1e293b;border-color:#22c55e!important">
          <div class="card-body d-flex align-items-center gap-3">
            <i class="bi bi-building fs-2" style="color:#22c55e"></i>
            <div>
              <div class="fs-2 fw-bold lh-1" style="color:#22c55e">{{ turmas().length }}</div>
              <div class="text-secondary small text-uppercase fw-semibold">Turmas</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="card border-0 border-start border-5 text-white h-100" style="background:#1e293b;border-color:#f59e0b!important">
          <div class="card-body d-flex align-items-center gap-3">
            <i class="bi bi-book-fill fs-2" style="color:#f59e0b"></i>
            <div>
              <div class="fs-2 fw-bold lh-1" style="color:#f59e0b">{{ modulos().length }}</div>
              <div class="text-secondary small text-uppercase fw-semibold">Módulos</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="card border-0 border-start border-5 text-white h-100" style="background:#1e293b;border-color:#41b6e6!important">
          <div class="card-body d-flex align-items-center gap-3">
            <i class="bi bi-file-text-fill fs-2" style="color:#41b6e6"></i>
            <div>
              <div class="fs-2 fw-bold lh-1" style="color:#41b6e6">{{ conteudos().length }}</div>
              <div class="text-secondary small text-uppercase fw-semibold">Conteúdos</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card border-secondary text-white" style="background:#1e293b">
      <div class="card-body">
        <h5 class="card-title fw-bold mb-4">Distribuição de Usuários por Perfil</h5>
        <div class="chart-bars">
          <div class="bar-row" *ngFor="let item of roleDistribution()">
            <span class="bar-label">{{ item.label }}</span>
            <div class="bar-track">
              <div class="bar-fill" [style.width.%]="item.pct"></div>
            </div>
            <span class="bar-count">{{ item.count }}</span>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</div>
