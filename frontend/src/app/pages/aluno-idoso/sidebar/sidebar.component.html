<div class="sidebar">
  <div class="sidebar-logo">
    <h5>ReviEstuda</h5>
    <small>Plataforma Educacional</small>
  </div>

  <nav class="sidebar-nav">
    <ul class="nav flex-column gap-1">
      <li class="nav-item">
        <a class="nav-link" routerLink="/aluno-idoso" routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: true}">
          <i class="fi fi-sr-apps"></i>
          Início
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/aluno-idoso/modulos" routerLinkActive="active">
          <i class="fi fi-rr-book-alt"></i>
          Cursos
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/aluno-idoso/atividades" routerLinkActive="active">
          <i class="fi fi-rr-edit"></i>
          Atividades
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" (click)="abrirEditarPerfil()">
          <i class="fi fi-bs-user"></i>
          Minha Conta
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    <button class="btn btn-outline-light w-100 btn-sm" (click)="logout()"> Sair</button>
  </div>
</div>
