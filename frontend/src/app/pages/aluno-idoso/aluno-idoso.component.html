<div class="d-flex" [style.font-size.rem]="fontSize()" style="min-height: 100vh; background: #f5f7fb;">

  <app-sidebar-idoso (collapsedChange)="sidebarCollapsed.set($event)"></app-sidebar-idoso>

  <div class="content-wrapper" [style.margin-left]="sidebarCollapsed() ? '68px' : '15rem'" style="transition: margin-left 0.25s ease;">

   <div class="main-header">
  <div class="header-spacer"></div>

  <div class="header-boas-vindas"> Seja 
    Bem-vindo, <strong>{{ userName() }}</strong>
  </div>

  <div class="header-acoes">
    <div class="font-controls">
      <span class="text-muted small fw-semibold">Texto:</span>
      <button class="font-btn" (click)="changeFontSize(-0.1)" id="font-decrease" title="Diminuir Texto">A-</button>
      <button class="font-btn" (click)="changeFontSize(0.1)" id="font-increase" title="Aumentar Texto">A+</button>
    </div>

    <div class="d-flex align-items-center gap-2" style="cursor: pointer;" (click)="abrirEditarPerfil()">
      <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold"
        style="width: 36px; height: 36px; background: #0f2744 !important;">
        {{ userName().charAt(0).toUpperCase() }}
      </div>
      <div>
        <div class="fw-semibold small">{{ userName() }}</div>
        <div class="text-muted" style="font-size: 11px;">Aluno(a)</div>
      </div>
    </div>

    <button class="btn-sair-topo" (click)="abrirModalLogout()">Sair</button>
  </div>
</div>
    <router-outlet></router-outlet>

  </div>
</div>

<app-editar-perfil [isOpen]="isEditProfileOpen()" (close)="fecharEditarPerfil()"
  (saveSuccess)="onProfileUpdated($event)"></app-editar-perfil>

<app-confirm-dialog [isOpen]="isLogoutModalOpen()" title="Sair da conta"
  message="Tem certeza que deseja sair da sua conta?" confirmLabel="Sair" variant="danger"
  (confirmed)="logout()" (cancelled)="cancelarLogout()"></app-confirm-dialog>
