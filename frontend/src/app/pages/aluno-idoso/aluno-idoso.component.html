<div class="d-flex" [style.font-size.rem]="fontSize()" style="min-height: 100vh; background: #f5f7fb;">

  <div class="sidebar">
    <div class="sidebar-logo">
      <h5>ReviEstuda</h5>
      <small>Plataforma Educacional</small>
    </div>

    <nav class="sidebar-nav">
      <ul class="nav flex-column gap-1">
        <li class="nav-item">
          <a class="nav-link" routerLink="/aluno-idoso" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            Início
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/aluno-idoso/modulos" routerLinkActive="active">
            Módulos
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/aluno-idoso/atividades" routerLinkActive="active">
            Atividades
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-outline-light w-100 btn-sm" (click)="logout()"> Sair</button>
    </div>
  </div>

  <div class="content-wrapper">

    <div class="main-header d-flex justify-content-between align-items-center">
      <input type="text" class="form-control w-25" placeholder=" Buscar..." [(ngModel)]="searchQuery" name="searchBar">

      <div class="d-flex align-items-center gap-4">
        <div class="font-controls">
          <span class="text-muted small fw-semibold">Texto:</span>
          <button class="font-btn" (click)="changeFontSize(-0.1)" id="font-decrease" title="Diminuir Texto">A-</button>
          <button class="font-btn" (click)="changeFontSize(0.1)" id="font-increase" title="Aumentar Texto">A+</button>
        </div>

        <div class="d-flex align-items-center gap-2" style="cursor: pointer;" (click)="abrirEditarPerfil()">
          <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold"
            style="width: 36px; height: 36px; background: #0f2744 !important;">
            {{ userName().charAt(0).toUpperCase() }}
          </div>
          <div>
            <div class="fw-semibold small">{{ userName() }}</div>
            <div class="text-muted" style="font-size: 11px;">Aluno(a)</div>
          </div>
        </div>
      </div>
    </div>

    <router-outlet></router-outlet>

  </div>
</div>

<app-editar-perfil [isOpen]="isEditProfileOpen()" (close)="fecharEditarPerfil()" (saveSuccess)="onProfileUpdated($event)"></app-editar-perfil>
