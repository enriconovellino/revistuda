<div>
  <div *ngIf="loading()" class="d-flex justify-content-center my-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="error()" class="alert alert-danger mb-4">
    {{ error() }}
  </div>

  <div *ngIf="!loading() && !error() && modulo()">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <button class="btn-voltar-global mb-3" (click)="voltar()">
          <i class="fi fi-rr-arrow-small-left"></i>
          Voltar para Módulos
        </button>
        <h4 class="mb-0 fw-bold">{{ modulo()?.titulo_modulo }}</h4>
        <small class="text-muted">
          {{ licoes().length }} lição(ões) neste módulo
        </small>
      </div>
    </div>

    <div class="error-banner alert alert-danger" *ngIf="actionError()">
      {{ actionError() }}
    </div>

    <div class="row g-4">
      <div class="col-md-12">
        <app-nova-licao [moduloId]="moduloId" (licaoCriada)="loadData()"></app-nova-licao>
      </div>
    </div>
  </div>
</div>
