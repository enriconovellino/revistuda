<div class="licao-card p-4 border rounded bg-white shadow-sm mb-4">
  <div class="d-flex justify-content-between align-items-start mb-3">
    <div>
      <h6 class="fw-bold text-dark mb-1" style="font-size: 17px;">{{ licao.titulo_licao }}</h6>
      <p class="text-muted small mb-0" *ngIf="licao.comentario">{{ licao.comentario }}</p>
    </div>
    <button class="btn btn-sm btn-outline-danger" (click)="deleteLicao()"
      [disabled]="saving()">
      Excluir Lição
    </button>
  </div>

  <div class="d-flex flex-column gap-3 mt-3">
    <div class="content-box p-3 border rounded position-relative"
      *ngFor="let conteudo of safeConteudos(); trackBy: trackByConteudo">

      <div *ngIf="activeEditContentId() !== conteudo.conteudo_id">
        <div class="position-absolute top-0 end-0 m-2 d-flex gap-2">
          <button class="btn btn-link text-primary p-0 small"
            style="text-decoration: none; font-size: 11px; font-weight: 500;"
            (click)="startEditConteudo(conteudo)">
            ✏️ Editar
          </button>
          <button class="btn btn-link text-danger p-0 small"
            style="text-decoration: none; font-size: 11px; font-weight: 500;"
            (click)="deleteConteudo(conteudo.conteudo_id)">
            ✕ Excluir
          </button>
        </div>

        <span class="badge bg-secondary text-white mb-2" style="font-size: 10px;">{{
          conteudo.tipo_conteudo | titlecase }}</span>

        <div class="mb-2" *ngIf="conteudo.texto_conteudo">
          <p class="mb-0 text-dark small"
            style="white-space: pre-wrap; line-height: 1.5; font-size: 13px;">{{ conteudo.texto_conteudo
            }}</p>
        </div>

        <div class="mt-2" *ngIf="conteudo.url_conteudo">
          <div
            *ngIf="conteudo.tipo_conteudo.toLowerCase() === 'vídeo' || conteudo.tipo_conteudo.toLowerCase() === 'video'">
            <div class="w-100"
              *ngIf="conteudo.safeUrl; else normalLink">
              <iframe [src]="conteudo.safeUrl" allowfullscreen
                style="border-radius: 8px; border: none; width: 100%; aspect-ratio: 16/9;"></iframe>
            </div>
            <ng-template #normalLink>
              <a [href]="conteudo.url_conteudo" target="_blank"
                class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-1">
                Assistir Vídeo (Link Externo) ↗
              </a>
            </ng-template>
          </div>

          <div
            *ngIf="conteudo.tipo_conteudo.toLowerCase() === 'áudio' || conteudo.tipo_conteudo.toLowerCase() === 'audio'">
            <audio controls class="w-100" *ngIf="conteudo.url_conteudo">
              <source [src]="conteudo.url_conteudo" type="audio/mpeg">
              Seu navegador não suporta o player de áudio.
            </audio>
            <a [href]="conteudo.url_conteudo" target="_blank"
              class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-1 mt-1"
              *ngIf="!conteudo.url_conteudo.endsWith('.mp3') && !conteudo.url_conteudo.endsWith('.wav')">
              Ouvir Áudio (Link Externo) ↗
            </a>
          </div>
        </div>
      </div>

      <div *ngIf="activeEditContentId() === conteudo.conteudo_id">
        <h6 class="fw-bold mb-3 small text-dark">Editar Conteúdo</h6>

        <div class="mb-3">
          <label class="form-label small fw-semibold text-dark">Texto do Conteúdo</label>
          <textarea class="form-control form-control-sm" rows="3"
            placeholder="Insira o texto explicativo..." [(ngModel)]="editContentTexto"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold text-dark">Tipo de Mídia</label>
          <select class="form-select form-select-sm" [(ngModel)]="editContentMidiaType">
            <option value="Texto">Sem Mídia (Apenas Texto)</option>
            <option value="Vídeo">Vídeo (YouTube)</option>
            <option value="Áudio">Áudio</option>
          </select>
        </div>

        <div class="mb-3" *ngIf="editContentMidiaType !== 'Texto'">
          <label class="form-label small fw-semibold text-dark">URL da Mídia <span
              class="text-danger">*</span></label>
          <input type="text" class="form-control form-control-sm"
            placeholder="Insira o link da mídia..." [(ngModel)]="editContentUrl" />
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button class="btn btn-sm btn-outline-secondary"
            (click)="cancelEditConteudo()">Cancelar</button>
          <button class="btn btn-sm btn-success" (click)="saveEditConteudo(conteudo.conteudo_id)"
            [disabled]="saving()">Salvar</button>
        </div>
      </div>

    </div>
  </div>

  <div class="mt-3 d-flex justify-content-end">
    <button class="btn btn-sm btn-outline-primary" (click)="toggleAddContentForm()">
      {{ showAddContentForm() ? 'Cancelar' : '+ Adicionar Conteúdo' }}
    </button>
  </div>

  <div class="alert alert-danger mt-3" *ngIf="actionError()">
    {{ actionError() }}
  </div>

  <div class="card mt-3 p-3 bg-light border border-dashed"
    *ngIf="showAddContentForm()" style="border-radius: 8px;">
    <h6 class="fw-bold mb-3 small text-dark">Adicionar Conteúdo à Lição</h6>

    <div class="mb-3">
      <label class="form-label small fw-semibold text-dark">Texto do Conteúdo</label>
      <textarea class="form-control form-control-sm" rows="3"
        placeholder="Digite o texto do conteúdo..." [(ngModel)]="addContentTexto"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label small fw-semibold text-dark">Tipo de Mídia</label>
      <select class="form-select form-select-sm" [(ngModel)]="addContentMidiaType">
        <option value="Texto">Sem Mídia (Apenas Texto)</option>
        <option value="Vídeo">Vídeo (YouTube)</option>
        <option value="Áudio">Áudio</option>
      </select>
    </div>

    <div class="mb-3" *ngIf="addContentMidiaType !== 'Texto'">
      <label class="form-label small fw-semibold text-dark">URL da Mídia <span
          class="text-danger">*</span></label>
      <input type="text" class="form-control form-control-sm" placeholder="Link da mídia..."
        [(ngModel)]="addContentUrl" />
    </div>

    <div class="d-flex justify-content-end gap-2">
      <button class="btn btn-sm btn-outline-secondary"
        (click)="toggleAddContentForm()">Cancelar</button>
      <button class="btn btn-sm btn-success" (click)="addConteudo()"
        [disabled]="saving()">Salvar</button>
    </div>
  </div>

  <app-atividades-professor 
    [licaoId]="licao.licao_id" 
    [atividades]="atividades" 
    (atividadeAlterada)="onAtividadeAlterada()">
  </app-atividades-professor>
</div>
