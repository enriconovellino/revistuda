<div class="chart-card">
  <h5 class="fw-bold mb-4 text-dark">✨ Nova Lição</h5>

  <div class="alert alert-danger mb-3" *ngIf="actionError()">
    {{ actionError() }}
  </div>

  <div class="mb-3">
    <label class="form-label small fw-bold">Título da Lição <span class="text-danger">*</span></label>
    <input type="text" class="form-control form-control-sm" placeholder="Ex: Lição 1: Somando Números"
      [(ngModel)]="newLicaoTitulo" />
  </div>

  <div class="mb-3">
    <label class="form-label small fw-bold">Comentário/Descrição</label>
    <input type="text" class="form-control form-control-sm" placeholder="Opcional"
      [(ngModel)]="newLicaoComentario" />
  </div>

  <div class="mb-3">
    <label class="form-label small fw-bold">Texto do Conteúdo</label>
    <textarea class="form-control form-control-sm" rows="5"
      placeholder="Digite o texto explicativo da lição..." [(ngModel)]="newLicaoTexto"></textarea>
  </div>

  <div class="mb-3">
    <label class="form-label small fw-bold">Tipo de Mídia</label>
    <select class="form-select form-select-sm" [(ngModel)]="newLicaoMidiaType">
      <option value="Texto">Sem Mídia (Apenas Texto)</option>
      <option value="Vídeo">Vídeo (Youtube)</option>
      <option value="Áudio">Áudio</option>
    </select>
  </div>

  <div class="mb-4" *ngIf="newLicaoMidiaType !== 'Texto'">
    <label class="form-label small fw-bold">URL da Mídia <span class="text-danger">*</span></label>
    <input type="text" class="form-control form-control-sm"
      [placeholder]="newLicaoMidiaType === 'Vídeo' ? 'Ex: https://www.youtube.com/watch?v=...' : 'Ex: https://exemplo.com/audio.mp3'"
      [(ngModel)]="newLicaoUrl" />
  </div>

  <button class="btn btn-success btn-sm w-100 py-2 d-flex justify-content-center align-items-center gap-2"
    (click)="createLicao()" [disabled]="saving()">
    <div class="spinner-border spinner-border-sm" role="status" *ngIf="saving()"></div>
    {{ saving() ? 'Salvando...' : 'Criar Lição' }}
  </button>
</div>
