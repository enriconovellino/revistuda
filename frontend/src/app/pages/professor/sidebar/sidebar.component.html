<div class="sidebar" [class.collapsed]="collapsed()">
  <div class="sidebar-logo">
    <div class="sidebar-logo-inner">
      <div class="sidebar-brand" *ngIf="!collapsed()">
        <h5>ReviEstuda</h5>
        <small>Plataforma Educacional</small>
      </div>
      <div class="sidebar-brand-icon" *ngIf="collapsed()">
        <span class="brand-icon-letter">R</span>
      </div>
      <button class="sidebar-toggle-btn" (click)="toggleCollapse()" [title]="collapsed() ? 'Expandir menu' : 'Minimizar menu'">
        <i [class]="collapsed() ? 'fi fi-rr-angle-double-right' : 'fi fi-rr-angle-double-left'"></i>
      </button>
    </div>
  </div>

  <nav class="sidebar-nav">
    <ul class="nav flex-column gap-1">
      <li class="nav-item" [title]="collapsed() ? 'Dashboard' : ''">
        <a class="nav-link d-flex align-items-center gap-2" [class.active]="isDashboardActive()" routerLink="/professor/dashboard">
          <i class="fi fi-rr-apps-add"></i>
          <span *ngIf="!collapsed()">Dashboard</span>
        </a>
      </li>
      <li class="nav-item" [title]="collapsed() ? 'Turmas' : ''">
        <a class="nav-link d-flex align-items-center gap-2" [class.active]="isTurmasActive()" routerLink="/professor/turmas">
          <i class="fi fi-rr-users"></i>
          <span *ngIf="!collapsed()">Turmas</span>
        </a>
      </li>
      <li class="nav-item" [title]="collapsed() ? 'Alunos' : ''">
        <a class="nav-link d-flex align-items-center gap-2" [class.active]="isAlunosActive()" routerLink="/professor/alunos">
          <i class="fi fi-rr-graduation-cap"></i>
          <span *ngIf="!collapsed()">Alunos</span>
        </a>
      </li>
      <li class="nav-item" [title]="collapsed() ? 'Comentários' : ''">
        <a class="nav-link d-flex align-items-center gap-2" [class.active]="isComentariosActive()" routerLink="/professor/comentarios">
          <i class="fi fi-rr-document-signed"></i>
          <span *ngIf="!collapsed()">Comentários</span>
        </a>
      </li>
    </ul>
  </nav>

</div>
