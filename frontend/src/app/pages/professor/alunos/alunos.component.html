<!-- Cabeçalho -->
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h4 class="mb-0 fw-bold">Meus Alunos</h4>
    <small class="text-muted">Acompanhe o desempenho e filtre por turma.</small>
  </div>
</div>

<!-- Erros -->
<div class="alert alert-danger py-2 small" *ngIf="error()">{{ error() }}</div>

<!-- Barra de busca e filtros -->
<div class="d-flex flex-wrap gap-3 align-items-center mb-4">
  <div class="search-box">
    <input
      type="text"
      class="form-control form-control-sm"
      placeholder="Buscar por nome..."
      [ngModel]="searchTerm()"
      (ngModelChange)="searchTerm.set($event)"
    />
  </div>

  <div class="turma-select-wrap">
    <select class="form-select form-select-sm" (change)="onTurmaChange($any($event.target).value)">
      <option value="">Todas as turmas</option>
      <option *ngFor="let turma of turmasDisponiveis()" [value]="turma.turma_id"
        [selected]="turmaFiltro() === turma.turma_id">
        {{ turma.nome_turma }}
      </option>
    </select>
  </div>

  <button class="chip" [class.active]="turmaFiltro() === null && searchTerm() === ''" (click)="limparFiltros()">
    Todos
  </button>
</div>

<!-- Tabela -->
<div class="chart-card p-0" *ngIf="!loading(); else carregando">
  <div class="table-responsive" *ngIf="alunosFiltrados().length > 0; else semAlunos">
    <table class="table align-middle mb-0">
      <thead>
        <tr class="text-muted small text-uppercase">
          <th class="ps-4">Nome</th>
          <th>Turma</th>
          <th class="pe-4 text-end">Taxa de Acertos</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let aluno of alunosFiltrados()">
          <td class="ps-4">
            <div class="fw-semibold text-dark">{{ aluno.nome }}</div>
          </td>
          <td>
            <span class="turma-tag">{{ aluno.nome_turma }}</span>
          </td>
          <td class="pe-4 text-end">
            <span class="badge-taxa" [ngClass]="taxaClass(aluno)">
              {{ taxaAcerto(aluno) }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #semAlunos>
    <div class="empty-state">
      <p class="mb-0">Nenhum aluno encontrado para os filtros selecionados.</p>
    </div>
  </ng-template>
</div>

<ng-template #carregando>
  <div class="empty-state">
    <p class="mb-0">Carregando alunos...</p>
  </div>
</ng-template>
