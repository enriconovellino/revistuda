<div class="page-wrapper d-flex align-items-center justify-content-center">
  <div class="card-box">

    <div *ngIf="!enviado()">
      <h3 class="fw-bold mb-2 text-dark">Esqueceu sua senha?</h3>
      <p class="text-muted mb-4" style="font-size: 14px;">
        Digite o e-mail cadastrado e enviaremos um link para você redefinir sua senha.
      </p>

      <div class="alert alert-danger" *ngIf="error()">{{ error() }}</div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">E-mail</label>
        <input type="email" class="form-control" placeholder="seuemail@exemplo.com" [(ngModel)]="email" name="email"
          (keyup.enter)="enviar()" maxlength="150" />
      </div>

      <button class="btn btn-primary w-100 py-2 d-flex justify-content-center align-items-center gap-2"
        (click)="enviar()" [disabled]="loading()">
        <div class="spinner-border spinner-border-sm" role="status" *ngIf="loading()"></div>
        {{ loading() ? 'Enviando...' : 'Enviar link de recuperação' }}
      </button>

      <div class="mt-4">
        <button class="btn btn-outline-primary w-100" (click)="voltarParaLogin()">
          ← Voltar para o login
        </button>
      </div>
    </div>

    <div *ngIf="enviado()" class="text-center">
      <div class="mb-3" style="font-size: 48px;">📧</div>
      <h4 class="fw-bold mb-2 text-dark">E-mail enviado!</h4>
      <p class="text-muted mb-4" style="font-size: 14px;">
        Se o e-mail <strong>{{ email }}</strong> estiver cadastrado, você vai receber um link para redefinir sua senha
        em alguns instantes. O link expira em 1 hora.
      </p>
      <button class="btn btn-outline-primary w-100" (click)="voltarParaLogin()">Voltar para o login</button>
    </div>

  </div>
</div>
