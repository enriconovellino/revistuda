<div class="modal-overlay" *ngIf="isOpen()">
  <div class="modal-card">
    <div class="modal-header">
      <h5 class="fw-bold mb-0 text-dark">{{ title() }}</h5>
      <button class="btn-close-modal" (click)="onCancel()" [disabled]="loading()">✕</button>
    </div>

    <div class="modal-body">
      <p class="mb-0 text-muted">{{ message() }}</p>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" class="btn btn-outline-secondary btn-sm px-3" (click)="onCancel()" [disabled]="loading()">
          {{ cancelLabel() }}
        </button>
        <button type="button" class="btn btn-sm px-4" [class.btn-primary]="variant() === 'primary'"
          [class.btn-danger]="variant() === 'danger'" (click)="onConfirm()" [disabled]="loading()">
          <span *ngIf="!loading()">{{ confirmLabel() }}</span>
          <span *ngIf="loading()">Aguarde...</span>
        </button>
      </div>
    </div>
  </div>
</div>
