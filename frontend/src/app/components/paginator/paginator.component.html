<div class="paginator" *ngIf="totalPaginas > 1">
  <button class="pag-btn" [disabled]="paginaAtual <= 1" (click)="anterior()">← Anterior</button>
  <span class="pag-info">Página {{ paginaAtual }} de {{ totalPaginas }}</span>
  <button class="pag-btn" [disabled]="paginaAtual >= totalPaginas" (click)="proxima()">Próxima →</button>
</div>
