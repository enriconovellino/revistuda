services:
  database:
    image: postgres:15-alpine
    container_name: revistuda-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1978"
      POSTGRES_DB: revistuda
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revistuda-backend
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:1978@database:5432/revistuda
      PORT: 3000
      JWT_SECRET: revistuda-super-secret-key-2026-very-secure-phrase-here
      NODE_ENV: production
    ports:
      - "3000:3000"
    command: sh -c "npm run migration:deploy && node dist/main"

volumes:
  postgres_data:
    driver: local
